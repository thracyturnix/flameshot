name: Publish APT repository

on:
  push:
    branches:
      - master
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "data/**"
      - "debian/**"
      - "src/**"
      - ".github/workflows/publish-apt.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'thracyturnix/flameshot'
    runs-on: ubuntu-latest
    container: debian:13

    steps:
      - name: Install bootstrap tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git devscripts equivs
      - name: Allow the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive mk-build-deps -i -r \
            -t "apt-get -y --no-install-recommends" debian/control
      - name: Give each build a newer package version
        run: |
          # e.g. 14.0.0+thracyturnix-1 becomes 14.0.0+thracyturnix-<run number>,
          # so every published build is an upgrade without editing the changelog.
          sed -i "1s/^\(flameshot ([^)]*\)-[0-9]*)/\1-${GITHUB_RUN_NUMBER})/" debian/changelog
          head -1 debian/changelog
      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir packages
          find .. -maxdepth 1 -name 'flameshot_*.deb' -exec mv {} packages/ \;
          ls -l packages
      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: flameshot-apt-package
          path: packages/*.deb

  publish:
    if: github.repository == 'thracyturnix/flameshot'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev
      - name: Download Debian package
        uses: actions/download-artifact@v8
        with:
          name: flameshot-apt-package
          path: packages
      - name: Build and sign repository
        run: |
          test -n "$APT_SIGNING_PRIVATE_KEY"
          printf '%s' "$APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          fpr="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          test -n "$fpr"
          mkdir -p repository/pool/main repository/dists/stable/main/binary-amd64
          cp packages/*.deb repository/pool/main/
          cd repository
          dpkg-scanpackages pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -9 -k dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin='thracyturnix' \
            -o APT::FTPArchive::Release::Label='thracyturnix Flameshot' \
            -o APT::FTPArchive::Release::Suite='stable' \
            -o APT::FTPArchive::Release::Codename='stable' \
            -o APT::FTPArchive::Release::Architectures='amd64' \
            -o APT::FTPArchive::Release::Components='main' \
            release dists/stable > dists/stable/Release
          gpg --batch --yes --local-user "$fpr" \
            --output dists/stable/Release.gpg --detach-sign dists/stable/Release
          gpg --batch --yes --local-user "$fpr" \
            --output dists/stable/InRelease --clearsign dists/stable/Release
          gpg --batch --export "$fpr" > thracyturnix-flameshot-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/thracyturnix-flameshot-archive-keyring.gpg] https://thracyturnix.github.io/flameshot stable main' \
            > thracyturnix-flameshot.list
      - name: Upload APT repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: repository
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@v4
